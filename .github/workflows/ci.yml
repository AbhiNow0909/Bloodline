name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.18" # keep in sync with backend/Dockerfile
  DATABASE_URL: postgresql+psycopg://bloodline:bloodline@localhost:5432/bloodline

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bloodline
          POSTGRES_PASSWORD: bloodline
          POSTGRES_DB: bloodline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloodline -d bloodline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no major tags since v8; pin the immutable release's commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend

      - name: Generate a throwaway JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bloodline
          POSTGRES_PASSWORD: bloodline
          POSTGRES_DB: bloodline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloodline -d bloodline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate a throwaway JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: bloodline-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /health against Postgres
        run: |
          docker run --detach --name api --network host \
            --env DATABASE_URL="$DATABASE_URL" --env JWT_SECRET="$JWT_SECRET" bloodline-api:ci
          curl --silent --show-error --fail --retry 15 --retry-delay 1 --retry-all-errors \
            http://localhost:8000/health
          echo
          uid="$(docker exec api id -u)"
          if [ "$uid" = "0" ]; then echo "::error::API container runs as root"; exit 1; fi

      - name: Migrate and seed an empty database from the image
        run: |
          docker exec api alembic upgrade head
          docker exec api alembic check
          docker exec api python -m app.cli.seed
          docker exec api python -m app.cli.seed # idempotent: second run must succeed too

      - name: Create a user, log in, create a family and member, upload a report
        run: |
          password="ci-smoke-test-password"
          echo "$password" | docker exec -i api python -m app.cli.create_user \
            --email smoke@example.test --name "CI Smoke" --password-stdin
          token="$(curl --silent --show-error --fail -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\": \"smoke@example.test\", \"password\": \"$password\"}" \
            | jq -r .access_token)"
          auth="Authorization: Bearer $token"
          curl --silent --show-error --fail http://localhost:8000/auth/me -H "$auth"
          echo
          family_id="$(curl --silent --show-error --fail -X POST http://localhost:8000/families \
            -H "$auth" -H 'Content-Type: application/json' -d '{"name": "CI Family"}' \
            | jq -r .id)"
          member_id="$(curl --silent --show-error --fail -X POST \
            "http://localhost:8000/families/$family_id/patients" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d '{"display_name": "CI Member", "sex": "female"}' | jq -r .id)"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/families)"
          if [ "$code" != "401" ]; then echo "::error::/families without a token gave $code"; exit 1; fi

          # Upload the synthetic report. CI has no GROQ_API_KEY, so background processing must
          # end in "failed" with that reason (extraction itself runs first and succeeds).
          pdf=backend/tests/fixtures/synthetic_thyrocare_report.pdf
          upload() {
            curl --silent --output /tmp/upload.json --write-out '%{http_code}' -X POST \
              "http://localhost:8000/patients/$member_id/reports" \
              -H "$auth" -H 'Content-Type: application/pdf' --data-binary "@$pdf"
          }
          code="$(upload)"
          if [ "$code" != "202" ]; then echo "::error::upload gave $code"; cat /tmp/upload.json; exit 1; fi
          report_id="$(jq -r .id /tmp/upload.json)"
          for _ in $(seq 1 30); do
            status="$(curl --silent --fail "http://localhost:8000/reports/$report_id" \
              -H "$auth" | jq -r .status)"
            [ "$status" != "processing" ] && break
            sleep 1
          done
          report="$(curl --silent --fail "http://localhost:8000/reports/$report_id" -H "$auth")"
          echo "$report"
          echo "$report" | jq -e '.status == "failed"' > /dev/null
          echo "$report" | jq -e '.failure_reason | contains("GROQ_API_KEY")' > /dev/null
          code="$(upload)"
          if [ "$code" != "409" ]; then echo "::error::duplicate upload gave $code"; exit 1; fi

          # Chat is wired, behind auth, and says clearly that CI has no Groq key.
          code="$(curl --silent --output /tmp/chat.json --write-out '%{http_code}' -X POST \
            "http://localhost:8000/patients/$member_id/chat" -H "$auth" \
            -H 'Content-Type: application/json' \
            -d '{"messages": [{"role": "user", "content": "Is anything out of range?"}]}')"
          if [ "$code" != "503" ]; then echo "::error::chat gave $code"; cat /tmp/chat.json; exit 1; fi
          jq -e '.detail | contains("GROQ_API_KEY")' /tmp/chat.json > /dev/null
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            "http://localhost:8000/families/$family_id/chat" -H 'Content-Type: application/json' \
            -d '{"messages": [{"role": "user", "content": "Hi"}]}')"
          if [ "$code" != "401" ]; then echo "::error::family chat without a token gave $code"; exit 1; fi

          # Insights are wired. Nothing is saved yet (no Groq key), so there are none, and
          # explaining them returns at once without calling the AI.
          curl --silent --fail "http://localhost:8000/patients/$member_id/insights" -H "$auth" \
            | jq -e '. == []' > /dev/null
          curl --silent --fail -X POST "http://localhost:8000/patients/$member_id/insights/explain" \
            -H "$auth" | jq -e '.explanations == [] and (.disclaimer | length > 0)' > /dev/null
          curl --silent --fail "http://localhost:8000/families/$family_id/overview" -H "$auth" \
            | jq -e '.members[0].insights == []' > /dev/null

      - name: Extract the synthetic report inside the image
        run: |
          docker exec -i api python -c "
          import sys
          from app.services.extraction import extract_report
          from app.services.structuring import structure_report  # LLM stack imports cleanly
          report = extract_report(sys.stdin.buffer.read())
          pages = [page.page_number for page in report.pages]
          assert pages == [3, 4, 5], pages
          print('extracted results pages', pages)
          " < backend/tests/fixtures/synthetic_thyrocare_report.pdf

      - name: Embedding model is baked in and works with no network
        run: |
          docker run --rm -i --network none \
            --env DATABASE_URL=postgresql+psycopg://unused@localhost/unused \
            --env JWT_SECRET="$JWT_SECRET" bloodline-api:ci python -c "
          import sys
          from app.services.embeddings import chunk_report, get_embedder
          from app.services.extraction import extract_report
          chunks = chunk_report(extract_report(sys.stdin.buffer.read()).pages)
          embedder = get_embedder()
          vectors = embedder.embed_passages(chunks)
          query = embedder.embed_query('how was ferritin measured')
          scores = [sum(a * b for a, b in zip(v, query)) for v in vectors]
          assert [len(v) for v in vectors] == [384, 384, 384], [len(v) for v in vectors]
          assert scores.index(max(scores)) == 2, scores  # the ferritin page
          print('offline embeddings ok, scores', [round(s, 3) for s in scores])
          " < backend/tests/fixtures/synthetic_thyrocare_report.pdf
          docker exec api python -m app.cli.rag reindex  # runs against the CI database

      - name: API container logs
        if: always()
        run: docker logs api || true
